<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector de Facturas AFIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{--ink:#EAF3F0;--paper:#0B0F0E;--panel:#121815;--panel2:#161D19;--teal:#22C79A;--teal-dark:#0E2420;--line:#233029;--muted:#7C9088;--err:#E07A63;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at top left, #0F1D19 0%, var(--paper) 55%);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  .wrap{max-width:1200px;margin:0 auto;padding:28px 18px 60px;}
  header{margin-bottom:22px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);margin:0 0 6px;}
  h1{font-size:26px;margin:0 0 8px;font-weight:600;color:#fff;}
  .drop{margin-top:22px;border:1.5px dashed var(--line);border-radius:6px;background:var(--panel);padding:26px 16px;text-align:center;cursor:pointer;}
  .drop b{font-weight:600;color:#fff;font-size:15px;}
  .drop small{display:block;margin-top:6px;color:var(--muted);font-size:12.5px;}
  input[type=file]{display:none;}
  .filelist{margin-top:18px;display:flex;flex-direction:column;gap:6px;}
  .frow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 12px;}
  .frow .name{flex:1;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#cfe3dc;}
  .status{font-size:12px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:20px;}
  .status.pend{background:#1B221F;color:var(--muted);}
  .status.busy{background:var(--teal-dark);color:var(--teal);}
  .status.ok{background:#123527;color:#4FE3A6;}
  .status.err{background:#331915;color:var(--err);}
  .actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:5px;border:1px solid var(--teal);background:var(--teal);color:#08130F;cursor:pointer;}
  button.ghost{background:transparent;color:var(--teal);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .table-container{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;margin-top:24px;font-size:12.5px;background:var(--panel);border:1px solid var(--line);}
  thead th{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;}
  thead th:nth-child(-n+3){text-align:left;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:'IBM Plex Mono',monospace;color:#dbe9e3;white-space:nowrap;}
  tbody td:nth-child(-n+3){text-align:left;font-family:'IBM Plex Sans',sans-serif;}
  .totalrow td{font-weight:600;border-top:1.5px solid var(--teal);color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">PROCESADOR MULTIPÁGINA AFIP</div>
    <h1>Lector Automático de Facturas</h1>
  </header>

  <label class="drop" id="dropArea">
    <b>Arrastrar PDFs o clic para seleccionar</b>
    <small>Filtra páginas de recibo y procesa la factura automáticamente.</small>
    <input type="file" id="fileInput" multiple accept="application/pdf">
  </label>

  <div class="filelist" id="fileList"></div>

  <div class="actions">
    <button id="btnProcess" disabled>Procesar Facturas</button>
    <button id="btnExport" class="ghost" disabled>Exportar a Excel</button>
    <button id="btnClear" class="ghost">Limpiar Lista</button>
  </div>

  <div class="table-container">
    <table id="resultTable" style="display:none;">
      <thead>
        <tr>
          <th>Archivo</th>
          <th>N° Comprobante</th>
          <th>CUIT / Proveedor</th>
          <th>Neto Gravado</th>
          <th>No Grav. / Exento</th>
          <th>IVA 21%</th>
          <th>IVA 27%</th>
          <th>IVA 10.5%</th>
          <th>IIBB CABA</th>
          <th>IIBB PBA</th>
          <th>Otros Imp.</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const dropArea = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const btnProcess = document.getElementById('btnProcess');
  const btnExport = document.getElementById('btnExport');
  const btnClear = document.getElementById('btnClear');
  const resultTable = document.getElementById('resultTable');
  const tableBody = document.getElementById('tableBody');
  const tableFoot = document.getElementById('tableFoot');

  let filesToProcess = [];
  let parsedResults = [];

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eName => {
    dropArea.addEventListener(eName, e => { e.preventDefault(); e.stopPropagation(); });
  });

  dropArea.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  dropArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(files) {
    for (let file of files) {
      if (file.type === 'application/pdf' && !filesToProcess.some(f => f.name === file.name)) {
        filesToProcess.push(file);
      }
    }
    renderFileList();
  }

  function renderFileList() {
    fileList.innerHTML = '';
    filesToProcess.forEach((f, idx) => {
      const row = document.createElement('div');
      row.className = 'frow';
      row.innerHTML = `<span class="name">${f.name}</span><span class="status pend" id="st-${idx}">Pendiente</span>`;
      fileList.appendChild(row);
    });
    btnProcess.disabled = filesToProcess.length === 0;
  }

  btnClear.addEventListener('click', () => {
    filesToProcess = [];
    parsedResults = [];
    renderFileList();
    resultTable.style.display = 'none';
    btnExport.disabled = true;
  });

  btnProcess.addEventListener('click', async () => {
    btnProcess.disabled = true;
    parsedResults = [];
    tableBody.innerHTML = '';

    for (let i = 0; i < filesToProcess.length; i++) {
      const file = filesToProcess[i];
      const stEl = document.getElementById(`st-${i}`);
      stEl.className = 'status busy';
      stEl.textContent = 'Leyendo...';

      try {
        const pagesText = await extractTextFromPDF(file);
        // Seleccionar la página que contiene la Factura (ignora hojas de recibos)
        let invoiceText = pagesText.find(p => /FACTURA|COMPROBANTE|COD\.\s*001|COD\.\s*006|COD\.\s*011/i.test(p)) || pagesText[pagesText.length - 1] || "";
        
        const data = parseInvoiceText(invoiceText, file.name);
        parsedResults.push(data);

        stEl.className = 'status ok';
        stEl.textContent = 'Procesado';
      } catch (err) {
        console.error(err);
        stEl.className = 'status err';
        stEl.textContent = 'Error lectura';
      }
    }

    renderTable();
    btnExport.disabled = false;
  });

  async function extractTextFromPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let pagesText = [];

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      
      const linesMap = {};
      textContent.items.forEach(item => {
        const y = Math.round(item.transform[5]); 
        if (!linesMap[y]) linesMap[y] = [];
        linesMap[y].push(item.str);
      });

      const sortedY = Object.keys(linesMap).sort((a, b) => b - a);
      let pageText = "";
      sortedY.forEach(y => { pageText += linesMap[y].join(" ") + "\n"; });
      pagesText.push(pageText);
    }

    return pagesText;
  }

  function parseInvoiceText(rawText, fileName) {
    const text = rawText.replace(/\r/g, ' ').replace(/[ \t]+/g, ' ');

    const result = {
      filename: fileName,
      docNumber: extractDocNumber(text),
      provider: extractProvider(text),
      neto: 0,
      noGravado: 0,
      iva21: 0,
      iva27: 0,
      iva10: 0,
      iibbCaba: 0,
      iibbPba: 0,
      otrosImp: 0,
      total: 0
    };

    function matchAmount(regexList) {
      for (let reg of regexList) {
        const match = text.match(reg);
        if (match && match[1]) {
          let valStr = match[1].trim().replace(/\./g, '').replace(',', '.');
          let val = parseFloat(valStr);
          if (!isNaN(val)) return val;
        }
      }
      return 0;
    }

    // 1. NÚMERO DE COMPROBANTE
    function extractDocNumber(txt) {
      const match = txt.match(/(?:P\.V\.|Punto\s+de\s+Venta|Comp\.\s*Nro|N°|Número)\s*[:\.\-]?\s*(\d{4,5})[\s\-]+(\d{8})/i);
      if (match) return `${match[1].padStart(5, '0')}-${match[2]}`;
      const simpleMatch = txt.match(/(\d{4,5}\-\d{8})/);
      return simpleMatch ? simpleMatch[1] : 'S/N';
    }

    // 2. NETO GRAVADO (Evita confundirse con los encabezados de IVA)
    result.neto = matchAmount([
      /(?:NETO\s+GRAVADO|IMPORTE\s+NETO\s+GRAVADO|SUBTOTAL\s+GRAVADO|SUBTOTAL\s+NETO)\s*[\$:]?\s*([\d\.,]+)/i,
      /(?:SUBTOTAL)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    // 3. DESGLOSE INDEPENDIENTE DE IVA
    result.iva21 = matchAmount([
      /(?:IVA\s*21\s*\%|ALICUOTA\s*21\s*\%|IVA\s*21)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    result.iva27 = matchAmount([
      /(?:IVA\s*27\s*\%|ALICUOTA\s*27\s*\%|IVA\s*27)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    result.iva10 = matchAmount([
      /(?:IVA\s*10[\.,]5\s*\%|ALICUOTA\s*10[\.,]5\s*\%|IVA\s*10\.5)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    // 4. NO GRAVADO / EXENTO
    result.noGravado = matchAmount([
      /(?:CONCEPTOS\s+NO\s+GRAVADOS|NETO\s+NO\s+GRAVADO|NO\s+GRAVADO|OP\.\s*NO\s*GRAVADAS|EXENTO)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    // 5. PERCEPCIONES Y RETENCIONES
    result.iibbCaba = matchAmount([
      /(?:PERC\.\s*IIBB\s*CABA|PERCEPCION\s+IIBB\s+CAPITAL|IIBB\s+CAPITAL|PERC\.\s*AGIP|AGIP\s+CABA)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    result.iibbPba = matchAmount([
      /(?:PERC\.\s*IIBB\s*BS\.?\s*AS\.?|PERCEPCION\s+IIBB\s+BUENOS\s+AIRES|IIBB\s+BS\s+AS|PERC\.\s*ARBA|ARBA)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    result.otrosImp = matchAmount([
      /(?:OTRAS\s+PERCEPCIONES|PERC\.\s*IVA|IMPUESTOS\s+INTERNOS|OTROS\s+TRIBUTOS)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    // 6. TOTAL
    result.total = matchAmount([
      /(?:IMPORTE\s+TOTAL|TOTAL\s+FACTURA|TOTAL\s+COMPROBANTE)\s*[\$:]?\s*([\d\.,]+)/i,
      /(?:TOTAL)\s*[\$:]?\s*([\d\.,]+)/i
    ]);

    return result;
  }

  function extractProvider(txt) {
    const cuitMatch = txt.match(/(?:CUIT|C\.U\.I\.T\.)\s*[:\-]?\s*(\d{2}[\-]?\d{8}[\-]?\d{1})/i);
    let cuitStr = cuitMatch ? cuitMatch[1] : 'Sin CUIT';

    const lines = txt.split('\n').map(l => l.trim()).filter(l => l.length > 3);
    let name = "Proveedor Desconocido";
    for (let i = 0; i < Math.min(lines.length, 10); i++) {
      if (!/FACTURA|COMPROBANTE|ORIGINAL|DUPLICADO|C\.U\.I\.T|PAGINA|RECIBO/i.test(lines[i])) {
        name = lines[i].substring(0, 25);
        break;
      }
    }
    return `${cuitStr} - ${name}`;
  }

  function fmt(val) {
    return val.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderTable() {
    resultTable.style.display = 'table';
    tableBody.innerHTML = '';

    let totals = { neto: 0, noGrav: 0, i21: 0, i27: 0, i10: 0, caba: 0, pba: 0, otros: 0, total: 0 };

    parsedResults.forEach(r => {
      totals.neto += r.neto;
      totals.noGrav += r.noGravado;
      totals.i21 += r.iva21;
      totals.i27 += r.iva27;
      totals.i10 += r.iva10;
      totals.caba += r.iibbCaba;
      totals.pba += r.iibbPba;
      totals.otros += r.otrosImp;
      totals.total += r.total;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.filename}</td>
        <td><b>${r.docNumber}</b></td>
        <td>${r.provider}</td>
        <td>$ ${fmt(r.neto)}</td>
        <td>$ ${fmt(r.noGravado)}</td>
        <td>$ ${fmt(r.iva21)}</td>
        <td>$ ${fmt(r.iva27)}</td>
        <td>$ ${fmt(r.iva10)}</td>
        <td>$ ${fmt(r.iibbCaba)}</td>
        <td>$ ${fmt(r.iibbPba)}</td>
        <td>$ ${fmt(r.otrosImp)}</td>
        <td>$ ${fmt(r.total)}</td>
      `;
      tableBody.appendChild(tr);
    });

    tableFoot.innerHTML = `
      <tr class="totalrow">
        <td colspan="3">TOTALES GENERALES</td>
        <td>$ ${fmt(totals.neto)}</td>
        <td>$ ${fmt(totals.noGrav)}</td>
        <td>$ ${fmt(totals.i21)}</td>
        <td>$ ${fmt(totals.i27)}</td>
        <td>$ ${fmt(totals.i10)}</td>
        <td>$ ${fmt(totals.caba)}</td>
        <td>$ ${fmt(totals.pba)}</td>
        <td>$ ${fmt(totals.otros)}</td>
        <td>$ ${fmt(totals.total)}</td>
      </tr>
    `;
  }

  btnExport.addEventListener('click', () => {
    const dataForExcel = parsedResults.map(r => ({
      "Archivo": r.filename,
      "Nro Comprobante": r.docNumber,
      "Proveedor / CUIT": r.provider,
      "Neto Gravado": r.neto,
      "No Gravado / Exento": r.noGravado,
      "IVA 21%": r.iva21,
      "IVA 27%": r.iva27,
      "IVA 10.5%": r.iva10,
      "IIBB CABA": r.iibbCaba,
      "IIBB PBA": r.iibbPba,
      "Otros Impuestos": r.otrosImp,
      "Total Factura": r.total
    }));

    const ws = XLSX.utils.json_to_sheet(dataForExcel);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Comprobantes");
    XLSX.writeFile(wb, "Resumen_Comprobantes.xlsx");
  });
</script>
</body>
</html>
